plugins {
    id 'com.android.application'
}

android {
    namespace 'com.danryu.glowmoth'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId 'com.danryu.glowmoth'
        minSdk 24
        targetSdk 35
        versionCode 14
        versionName "1.6.0"
    }

    // The debug keystore is the app's identity for updates: losing it means
    // the next APK cannot install over the old one. It lives at
    // app/debug.keystore (persistent workspace, gitignored, NEVER committed).
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
